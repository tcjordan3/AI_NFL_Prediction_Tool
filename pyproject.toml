[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-nfl-prediction-tool"
version = "0.1.0"
description = "NFL player stats and predictions"
requires-python = ">=3.11"
dependencies = [
    "joblib==1.5.3",
    "matplotlib==3.11.0",
    "numpy==2.4.6",
    "pandas==3.0.3",
    "scikit-learn==1.9.0",
    "shap==0.51.0",
    "streamlit==1.59.2",
    "xgboost==3.2.0",
]

[project.optional-dependencies]
dev = [
    "pipreqs",
    "jupyter",
]